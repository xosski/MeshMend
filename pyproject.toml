[project]
name = "meshmend-ai"
version = "0.1.0"
description = "STL repair assistant for holes, non-manifold cleanup, and detached-part bridging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "trimesh>=4.0",
]

[project.optional-dependencies]
neural = [
    "torch>=2.2",
]

[project.scripts]
meshmend = "meshmend_ai.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
